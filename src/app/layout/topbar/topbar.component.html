<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn hide-desktop" (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="search-wrap hide-mobile">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" class="input input-search search-input" placeholder="Search shipments, customers…" aria-label="Global search" id="global-search">
    </div>
  </div>

  <div class="topbar-right">
    <button class="icon-btn hide-desktop" aria-label="Search" (click)="searchVisible.set(!searchVisible())">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>

    <button class="icon-btn notif-btn" aria-label="Notifications" (click)="notifOpen.set(!notifOpen())">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span class="notif-dot"></span>
    </button>

    <div class="user-btn">
      <div class="topbar-avatar">{{ user()?.avatar }}</div>
      <div class="hide-mobile">
        <div class="topbar-name">{{ user()?.name }}</div>
        <div class="topbar-dept text-xs text-muted">{{ user()?.department }}</div>
      </div>
    </div>
  </div>
</header>

@if (searchVisible()) {
  <div class="mobile-search hide-desktop">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" class="input input-search" placeholder="Search…" autofocus aria-label="Mobile search" id="mobile-search">
    </div>
  </div>
}
