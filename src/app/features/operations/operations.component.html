<section class="page-shell operations-page">
  <div class="section-head">
    <div>
      <p class="eyebrow">Execution</p>
      <h2>Operations cockpit</h2>
    </div>
    <div class="tab-group">
      @for (tab of tabs; track tab) {
        <button type="button" [class.active]="activeTab() === tab" (click)="activeTab.set(tab)">
          {{ tab }}
        </button>
      }
    </div>
  </div>

  <div class="board-grid">
    @for (board of activeBoards(); track board.title) {
      <article class="board glass-card">
        <h3>{{ board.title }}</h3>
        @for (entry of board.entries; track entry.lane) {
          <div class="progress-card">
            <div class="progress-head">
              <strong>{{ entry.lane }}</strong>
              <span>{{ entry.progress }}%</span>
            </div>
            <div class="progress-bar">
              <span [style.width.%]="entry.progress"></span>
            </div>
            <p>{{ entry.note }}</p>
          </div>
        }
      </article>
    }
  </div>
</section>
